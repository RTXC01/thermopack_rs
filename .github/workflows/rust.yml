name: Rust migration
on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python tools/rust_port/verify_fixtures.py
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --release --tests
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
      - run: python tools/rust_port/generate_data.py
      - run: python tools/rust_port/generate_mbwr_data.py
      - run: python tools/rust_port/generate_unifac_data.py
      - run: python tools/rust_port/generate_solid_data.py
      - run: python tools/rust_port/generate_lj_meos_data.py
      - run: cargo fmt --all
      - run: python tools/rust_port/inventory.py
      - run: git diff --exit-code -- rust/src/data.rs rust/src/mbwr_data.rs rust/src/unifac_data.rs rust/src/solid_data.rs rust/src/lj_meos_data.rs docs/rust/mbwr-data.json docs/rust/inventory.json

  source-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y gfortran-13
      - run: python -m pip install numpy
      - run: python tools/rust_port/build_reference.py --compiler /usr/bin/gfortran-13
      - run: python tools/rust_port/build_probe.py --compiler /usr/bin/gfortran-13
      - run: python tools/rust_port/validate_cubic.py
      - run: python tools/rust_port/validate_saturation.py
      - run: python tools/rust_port/validate_derivatives.py
      - run: python tools/rust_port/validate_flash.py
      - run: python tools/rust_port/validate_initialization.py
      - run: python tools/rust_port/validate_caloric.py
      - run: python tools/rust_port/validate_ideal.py
      - run: python tools/rust_port/validate_ideal_configuration.py
      - run: python tools/rust_port/validate_alpha.py
      - run: python tools/rust_port/validate_alpha_properties.py
      - run: python tools/rust_port/validate_translation.py
      - run: python tools/rust_port/validate_beta.py
      - run: python tools/rust_port/validate_rr.py
      - run: python tools/rust_port/validate_rr_iteration.py
      - run: python tools/rust_port/validate_symmetric.py
      - run: python tools/rust_port/validate_response.py
      - run: python tools/rust_port/validate_sound.py
      - run: python tools/rust_port/validate_isochoric.py
      - run: python tools/rust_port/validate_pets.py
      - run: python tools/rust_port/validate_pets_equilibrium.py
      - run: python tools/rust_port/validate_pets_flash.py
      - run: python tools/rust_port/validate_pets_isochoric.py
      - run: python tools/rust_port/validate_mbwr.py
      - run: python tools/rust_port/validate_mbwr_properties.py
      - run: python tools/rust_port/validate_mbwr_equilibrium.py
      - run: python tools/rust_port/validate_mbwr_density.py
      - run: python tools/rust_port/validate_mbwr_initialization.py
      - run: python tools/rust_port/validate_unifac.py
      - run: python tools/rust_port/validate_unifac_cubic.py
      - run: python tools/rust_port/validate_solid_lines.py
      - run: python tools/rust_port/validate_solid_co2.py
      - run: python tools/rust_port/validate_solid_saturation.py
      - run: python tools/rust_port/validate_pseudo_components.py
      - run: python tools/rust_port/validate_isolines.py
      - run: python tools/rust_port/validate_spinodal.py
      - run: python tools/rust_port/validate_joule_thompson.py
      - run: python tools/rust_port/validate_virial.py
      - run: python tools/rust_port/validate_virial_matrix.py
      - run: python tools/rust_port/validate_ljs.py
      - run: python tools/rust_port/validate_ljs_spline.py
      - run: python tools/rust_port/validate_ljs_helmholtz.py
      - run: python tools/rust_port/validate_ljs_state.py
      - run: python tools/rust_port/validate_critical.py
      - run: python tools/rust_port/validate_mut_solve.py
      - run: python tools/rust_port/validate_hyperdual.py
      - run: python tools/rust_port/validate_solid_water.py
      - run: python tools/rust_port/validate_fmt.py
      - run: python tools/rust_port/validate_meos.py
      - run: python tools/rust_port/validate_meos_density.py
      - run: python tools/rust_port/benchmark_meos.py --compiler /usr/bin/gfortran-13 --preflight-only
      - run: python tools/rust_port/benchmark_fmt.py --compiler /usr/bin/gfortran-13 --preflight-only
      - run: python tools/rust_port/benchmark_solid_water.py --compiler /usr/bin/gfortran-13 --preflight-only
      - run: python tools/rust_port/benchmark_mbwr_density.py --compiler /usr/bin/gfortran-13 --preflight-only
      - run: python tools/rust_port/benchmark_pets_roots.py --compiler /usr/bin/gfortran-13 --preflight-only
      - run: python tools/rust_port/benchmark_isochoric.py --compiler /usr/bin/gfortran-13 --preflight-only
      - run: python tools/rust_port/benchmark_isochoric.py --compiler /usr/bin/gfortran-13 --tcpr --preflight-only
      - run: python tools/rust_port/validate_translated_flash.py
      - run: python tools/rust_port/verify_fixtures.py
