name: Rust migration
on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --release --tests
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'
      - run: python tools/rust_port/generate_data.py
      - run: python tools/rust_port/inventory.py
      - run: git diff --exit-code -- rust/src/data.rs docs/rust/inventory.json

  source-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y gfortran-13
      - run: python -m pip install numpy
      - run: python tools/rust_port/build_reference.py --compiler /usr/bin/gfortran-13
      - run: python tools/rust_port/validate_cubic.py
      - run: python tools/rust_port/validate_saturation.py
