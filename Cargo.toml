[package]
name = "thermopack-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 AND BSD-3-Clause"
description = "Native Rust migration of the ThermoPack thermodynamics library"
readme = "rust/README.md"

[lib]
path = "rust/src/lib.rs"

[[example]]
name = "cubic"
path = "rust/examples/cubic.rs"

[[example]]
name = "parity"
path = "rust/examples/parity.rs"

[[test]]
name = "mbwr_source_properties"
path = "tests/mbwr_source_properties.rs"
harness = false

[[test]]
name = "mbwr_source_density"
path = "tests/mbwr_source_density.rs"
harness = false

[[test]]
name = "mbwr_source_initialization"
path = "tests/mbwr_source_initialization.rs"
harness = false

[[bench]]
name = "cubic"
path = "rust/benches/cubic.rs"
harness = false

[[bench]]
name = "sound"
path = "rust/benches/sound.rs"
harness = false

[[bench]]
name = "isochoric"
path = "rust/benches/isochoric.rs"
harness = false

[[bench]]
name = "pets"
path = "rust/benches/pets.rs"
harness = false

[[bench]]
name = "pets_roots"
path = "rust/benches/pets_roots.rs"
harness = false

[[bench]]
name = "mbwr_density"
path = "rust/benches/mbwr_density.rs"
harness = false

[[bench]]
name = "solid_water"
path = "rust/benches/solid_water.rs"
harness = false

[[bench]]
name = "preparation"
path = "rust/benches/preparation.rs"
harness = false

[[bench]]
name = "fmt"
path = "rust/benches/fmt.rs"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
