[package]
name = "thermopack-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 AND BSD-3-Clause"
description = "Native Rust migration of the ThermoPack thermodynamics library"
readme = "rust/README.md"

[lib]
path = "rust/src/lib.rs"

[[example]]
name = "cubic"
path = "rust/examples/cubic.rs"

[[example]]
name = "parity"
path = "rust/examples/parity.rs"

[[bench]]
name = "cubic"
path = "rust/benches/cubic.rs"
harness = false

[[bench]]
name = "sound"
path = "rust/benches/sound.rs"
harness = false

[[bench]]
name = "isochoric"
path = "rust/benches/isochoric.rs"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
